      security: []
      responses:
        '200':
          description: ok
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API token or user access token
  responses:
    BadRequest:
      description: Validação/entrada inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Permissão insuficiente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Recurso ausente ou invisível
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Estado concorrente ou já existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    Asset:
      type: object
      required:
      - id
      - type
      - name
      - title
      - sharing_scope
      - status
      - latest_version
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - prompt
          - skill
        name:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        sharing_scope:
          type: string
          enum:
          - private
          - workspace
        status:
          type: string
          enum:
          - active
          - archived
          - deleted
        latest_version:
          type: integer
          minimum: 1
        owner_user_id:
          type: string
          format: uuid
          nullable: true
        tags:
          type: array
          items:
            type: string
        aliases:
          type: array
          items:
            $ref: '#/components/schemas/Alias'
    AssetList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        next_cursor:
          type: string
          nullable: true
    PromptVariable:
      type: object
      required:
      - name
      - type
      - required
      properties:
        name:
          type: string
          pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
        type:
          type: string
          enum:
          - string
          - number
          - boolean
        required:
          type: boolean
        default:
          nullable: true
    PromptDefinition:
      type: object
      required:
      - content
      - variables
      properties:
        content:
          type: string
          minLength: 1
        variables:
          type: array
          items:
            $ref: '#/components/schemas/PromptVariable'
        output_schema:
          type: object
          nullable: true
          additionalProperties: true
        model_config:
          type: object
          additionalProperties: true
        guardrails:
          type: array
          items: {}
        examples:
          type: array
          items: {}
    SkillAsset:
      type: object
      required:
      - text_content
      - is_executable
      properties:
        text_content:
          type: string
          maxLength: 1048576
        is_executable:
          type: boolean
          enum:
          - false
        content_hash:
          type: string
          description: sha256 do text_content, calculado no servidor
    SkillDefinition:
      type: object
      required:
      - description
      - body
      properties:
        description:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1
        assets:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SkillAsset'
          maxProperties: 10
        allowed_tools:
          type: array
          items:
            type: string
        input_contract:
          type: object
          additionalProperties: true
        output_contract:
          type: object
          additionalProperties: true
        guardrails:
          type: array
          items: {}
    Definition:
      oneOf:
      - $ref: '#/components/schemas/PromptDefinition'
      - $ref: '#/components/schemas/SkillDefinition'
    AssetCreate:
      type: object
      required:
      - name
      - title
      - sharing_scope
      - definition
      properties:
        name:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        title:
          type: string
          minLength: 1
        description:
          type: string
        sharing_scope:
          type: string
          enum:
          - private
          - workspace
        tags:
          type: array
          items:
            type: string
        notes:
          type: string
        definition:
          $ref: '#/components/schemas/Definition'
    AssetMetadataPatch:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        sharing_scope:
          type: string
          enum:
          - private
          - workspace
        owner_user_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - active
          - archived
          - deleted
    Version:
      type: object
      required:
      - asset_id
      - version
      - definition_hash
      - definition
      properties:
        asset_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        definition_hash:
          type: string
        definition:
          $ref: '#/components/schemas/Definition'
        notes:
          type: string
        created_at:
          type: string
          format: date-time
    VersionCreate:
      type: object
      required:
      - definition
      - notes
      - expected_latest_version
      properties:
        definition:
          $ref: '#/components/schemas/Definition'
        notes:
          type: string
          minLength: 1
        expected_latest_version:
          type: integer
          minimum: 1
    VersionCreated:
      type: object
      required:
      - asset_id
      - version
      - deduplicated
      properties:
        asset_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        definition_hash:
          type: string
        deduplicated:
          type: boolean
    VersionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Version'
    AliasMoveRequest:
      type: object
      required:
      - version
      - expected_current_version
      - reason
      properties:
        version:
          type: integer
          minimum: 1
        expected_current_version:
          type: integer
          nullable: true
        reason:
          type: string
          minLength: 1
        emergency:
          type: boolean
          default: false
    Alias:
      type: object
      required:
      - alias
      - version
      - revision
      properties:
        alias:
          type: string
          enum:
          - staging
          - production
        version:
          type: integer
          minimum: 1
        previous_version:
          type: integer
          nullable: true
        revision:
          type: integer
        moved_at:
          type: string
          format: date-time
    DiffResult:
      type: object
      properties:
        from_version:
          type: integer
        to_version:
          type: integer
        text_diff:
          type: string
        structural_diff:
          type: array
          items:
            type: object
            additionalProperties: true
    ResolveRef:
      oneOf:
      - type: object
        required:
        - version
        properties:
          version:
            type: integer
            minimum: 1
      - type: object
        required:
        - alias
        properties:
          alias:
            type: string
            enum:
            - staging
            - production
    ResolveRequest:
      type: object
      required:
      - ref
      properties:
        ref:
          $ref: '#/components/schemas/ResolveRef'
        variables:
          type: object
          additionalProperties: true
        caller_app:
          type: string
        environment:
          type: string
    ResolveResult:
      type: object
      required:
      - asset_id
      - resolved_version
      - definition_hash
      - trace_id
      properties:
        asset_id:
