openapi: 3.0.3
info:
  title: Prompt & Skill Registry API
  version: 0.2.0
  description: 'Contrato REST preliminar da versão Cloudflare: browser via Cloudflare Access + app RBAC; integração
    bearer Registry token com Access Service Auth na borda quando habilitado. Não é token Cloudflare API. Conforme
    docs/05-auth-and-policy.md.'
servers:
- url: http://localhost:5173
  description: Local Worker dev (exemplo)
- url: https://registry.example.com
  description: Placeholder, não é endpoint ativo; proteger com Cloudflare Access
security:
- BearerAuth: []
paths:
  /v1/prompts:
    get:
      operationId: list_prompts
      summary: Listar prompts
      tags: &id001
      - Prompts
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: alias
        in: query
        required: false
        schema:
          type: string
      - name: scope
        in: query
        required: false
        schema:
          type: string
      - name: owner
        in: query
        required: false
        schema:
          type: string
      - name: tag
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      operationId: create_prompt
      summary: Criar prompt com v1
      tags: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/prompts/{id_or_name}:
    get:
      operationId: get_prompt
      summary: Detalhe de prompt
      tags: *id001
      parameters:
      - name: id_or_name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
